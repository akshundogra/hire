<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Redirecting · hire.akshundogra.com</title>
  <style>
    body {
      background-color: #0b0f19;
      color: #94a3b8;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
    }
    .card {
      background: #141b2d;
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 12px;
      padding: 32px 40px;
      text-align: center;
      box-shadow: 0 20px 40px rgba(0,0,0,0.5);
    }
    .spinner {
      width: 24px;
      height: 24px;
      border: 3px solid rgba(232, 197, 71, 0.2);
      border-top-color: #e8c547;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 0 auto 16px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    h2 { color: #f8fafc; margin: 0 0 8px; font-size: 18px; }
    p { margin: 0; font-size: 14px; }
    a { color: #e8c547; text-decoration: underline; }
  </style>
  <script>
    (function() {
      // 1. Clean incoming pathname (remove leading & trailing slashes, lower-case)
      var rawPath = window.location.pathname.replace(/^\/+|\/+$/g, '').toLowerCase();
      if (!rawPath) {
        window.location.replace('/');
        return;
      }

      // 2. Exact folder list on hire.akshundogra.com
      var validFolders = [
        "acto", "add", "apaleo", "buynomics", "centric-software", "connect-ad", 
        "constructor", "consultport", "contentful", "donnerstagai", "ecog", 
        "eye-able", "eyeable", "glocomms", "hallo-theo", "impossible-cloud", 
        "ingestro", "instaffo", "jobgether", "knowunity", "kombo", "lovehoney-group", 
        "makersite", "mdis", "mdis-pitch", "netbird", "paricon", "quantum-systems", 
        "rencore", "reonic", "riverty", "secfix", "seven-senders", "sharpist", 
        "taxfix", "temedica", "traide", "vision-healthcare-nv", "workflex", "workflow-request"
      ];

      // 3. Known explicit shorthand & misspelling map
      var explicitAliasMap = {
        "ronic": "reonic",
        "reonic": "reonic",
        "reonic-de": "reonic",
        "reonic-com": "reonic",
        "eyeable": "eye-able",
        "eye-able": "eye-able",
        "mdis": "mdis-pitch",
        "mdispitch": "mdis-pitch",
        "theo": "hallo-theo",
        "hallotheo": "hallo-theo",
        "lovehoney": "lovehoney-group",
        "visionhealthcare": "vision-healthcare-nv",
        "centric": "centric-software",
        "impossiblecloud": "impossible-cloud",
        "sevensenders": "seven-senders",
        "quantumsystems": "quantum-systems",
        "connectad": "connect-ad"
      };

      // 4. Check explicit match first
      if (explicitAliasMap[rawPath]) {
        window.location.replace('/' + explicitAliasMap[rawPath] + '/');
        return;
      }

      // 5. Check direct folder match
      if (validFolders.indexOf(rawPath) !== -1) {
        window.location.replace('/' + rawPath + '/');
        return;
      }

      // 6. Fuzzy normalization matcher (strip non-alphanumeric chars)
      var cleanInput = rawPath.replace(/[^a-z0-9]/g, '');
      for (var i = 0; i < validFolders.length; i++) {
        var folder = validFolders[i];
        var cleanFolder = folder.replace(/[^a-z0-9]/g, '');
        if (cleanFolder === cleanInput || cleanFolder.indexOf(cleanInput) !== -1 || cleanInput.indexOf(cleanFolder) !== -1) {
          window.location.replace('/' + folder + '/');
          return;
        }
      }

      // Fallback: Redirect to home page
      setTimeout(function() {
        window.location.replace('/');
      }, 1500);
    })();
  </script>
</head>
<body>
  <div class="card">
    <div class="spinner"></div>
    <h2>Redirecting to target company page...</h2>
    <p>If you are not redirected automatically, <a href="/">click here to go home</a>.</p>
  </div>
</body>
</html>
